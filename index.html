<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valorant Sensitivity Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1923; --bg2: #121f2b; --panel: rgba(22, 36, 50, 0.72); --panel-solid: #162432; --row: rgba(255, 255, 255, 0.035);
    --line: #263746; --line2: #33495c; --ink: #ece8e1; --muted: #8fa0ae; --dim: #5d6f7e;
    --teal: #2ad6b0; --red: #ff4655; --pink: #d24bd6; --yellow: #f2d06b; --focus: #2ad6b0;
    --head: "Barlow Condensed", "DIN Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.22, .61, .36, 1);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-text-size-adjust: 100%; min-height: 100vh;
    background-image: radial-gradient(1200px 600px at 70% -10%, rgba(42, 214, 176, 0.07), transparent 60%), radial-gradient(900px 500px at 0% 110%, rgba(255, 70, 85, 0.05), transparent 60%); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 20px;
    background: rgba(15, 25, 35, 0.86); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { font: 700 18px/1 var(--head); letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 10px; height: 10px; background: var(--red); transform: rotate(45deg); display: inline-block; }
  .top .crumb { font: 600 13px/1 var(--head); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-left: auto; }
  .progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--teal); width: 0; transition: width .5s var(--ease); box-shadow: 0 0 12px rgba(42, 214, 176, .6); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 36px 20px 64px; }
  .wrap.wide { max-width: none; padding: 32px clamp(16px, 2.6vw, 56px) 64px; }
  h2[tabindex="-1"]:focus { outline: none; }

  /* ---------- questionnaire ---------- */
  .q { max-width: 680px; margin: 4vh auto 0; }
  .q-sec { font: 600 13px/1 var(--head); letter-spacing: .2em; text-transform: uppercase; color: var(--teal); display: flex; gap: 10px; align-items: center; }
  .q-sec span { color: var(--dim); }
  .parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 26px; }
  .part { font: 600 12px/1 var(--head); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); padding-top: 9px; border-top: 2px solid var(--line2); transition: color .3s, border-color .3s; }
  .part b { color: inherit; margin-right: 6px; }
  .part.done { color: var(--muted); border-top-color: rgba(42, 214, 176, .45); }
  .part.on { color: var(--ink); border-top-color: var(--teal); }
  .q h2 { font: 700 clamp(30px, 5.4vw, 46px)/1.02 var(--head); text-transform: uppercase; letter-spacing: .01em; margin: 12px 0 10px; }
  .why { color: var(--muted); margin: 0 0 6px; max-width: 60ch; }
  .uses { color: var(--dim); font-size: 13px; margin: 0 0 22px; display: flex; gap: 8px; }
  .uses::before { content: "i"; flex: none; width: 16px; height: 16px; border: 1px solid var(--dim); border-radius: 50%; font: 600 11px/14px var(--body); text-align: center; margin-top: 1px; }

  .choices { display: grid; gap: 8px; grid-template-columns: 1fr; }
  .choices.c2 { grid-template-columns: repeat(2, 1fr); }
  .choices.c3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 560px) { .choices.c2, .choices.c3 { grid-template-columns: 1fr; } }
  .choice { position: relative; overflow: hidden; text-align: left; cursor: pointer; background: var(--panel); border: 1px solid var(--line);
    padding: 13px 16px 13px 18px; display: flex; flex-direction: column; gap: 1px; min-height: 52px;
    transition: border-color .2s, background .2s, transform .2s var(--ease); }
  .choice::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--teal); transform: scaleY(0); transition: transform .25s var(--ease); }
  .choice:hover { border-color: var(--line2); background: rgba(30, 48, 64, .8); }
  .choice:hover::before { transform: scaleY(.45); }
  .choice[aria-pressed="true"] { border-color: rgba(42, 214, 176, .55); background: linear-gradient(90deg, rgba(42, 214, 176, .14), rgba(42, 214, 176, .02)); }
  .choice[aria-pressed="true"]::before { transform: scaleY(1); }
  .choice:active { transform: scale(.99); }
  .c-l { font: 600 17px/1.2 var(--head); letter-spacing: .04em; text-transform: uppercase; }
  .c-s { font-size: 13px; color: var(--muted); }

  label.f { display: block; font: 600 13px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  label.f small { font: 400 12px var(--body); letter-spacing: 0; text-transform: none; color: var(--dim); }
  input[type="number"], select, textarea { background: var(--panel-solid); border: 1px solid var(--line); border-bottom-color: var(--line2);
    padding: 11px 12px; width: 100%; max-width: 280px; min-height: 46px; border-radius: 0; transition: border-color .2s; }
  input[type="number"]:focus, select:focus, textarea:focus { border-color: var(--teal); outline: none; }
  textarea { max-width: 100%; min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1 1 170px; min-width: 0; }
  input[type="range"] { width: 100%; accent-color: var(--teal); margin: 10px 0 4px; height: 28px; }
  .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 12px; }
  details { margin: 16px 0 0; border: 1px solid var(--line); padding: 10px 14px; background: var(--panel); }
  summary { cursor: pointer; font: 600 14px var(--head); letter-spacing: .1em; text-transform: uppercase; }
  details p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .tip { color: var(--dim); font-size: 13px; margin: 10px 0 0; }
  .chk { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--muted); text-align: left; }
  .chk i { flex: none; width: 18px; height: 18px; border: 1px solid var(--line2); display: grid; place-items: center; }
  .chk[aria-pressed="true"] { color: var(--ink); } .chk[aria-pressed="true"] i { background: var(--teal); border-color: var(--teal); }
  .chk[aria-pressed="true"] i::after { content: ""; width: 8px; height: 4px; border: solid #0f1923; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  .q-body > .choice + .choice { margin-top: 8px; }
  .q.wideq { max-width: 980px; }
  .vis-row { margin: 0 0 14px; }
  .vis-h { font: 600 12px/1 var(--head); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .vis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
  .vis-c { position: relative; padding: 0; border: 1px solid var(--line); background: #000; cursor: pointer; height: 86px; overflow: hidden; transition: border-color .2s, box-shadow .2s; }
  .vis-c canvas { display: block; width: 100%; height: 84px; }
  .vis-c span { position: absolute; left: 6px; top: 5px; font: 700 12px/1 var(--head); color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .vis-c:hover { border-color: var(--muted); }
  .vis-c[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal); }
  .dt { position: relative; border: 1px solid var(--line); background: #000; user-select: none; touch-action: manipulation; }
  .dt canvas { display: block; width: 100%; cursor: crosshair; }
  .dt-over { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: rgba(15, 25, 35, .78); text-align: center; padding: 16px; }
  .dt-over[hidden] { display: none; }
  .dt-over p { margin: 0; max-width: 42ch; color: var(--ink); }
  .dt-res table { margin-top: 12px; }
  i.sw { display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px; }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; }
  .btn { cursor: pointer; border: 1px solid var(--line2); background: transparent; padding: 12px 26px; min-height: 46px;
    font: 700 15px/1 var(--head); letter-spacing: .16em; text-transform: uppercase; transition: background .2s, border-color .2s, opacity .2s, transform .15s; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
  .btn.primary:hover:not(:disabled) { background: #ff5a67; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.small { padding: 9px 16px; min-height: 38px; font-size: 13px; }

  /* entrance animations */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes riseBack { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .anim { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  .back .anim { animation-name: riseBack; }

  /* ---------- results ---------- */
  .sum { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: clamp(10px, 1.2vw, 20px); margin: 4px 0 30px; }
  @media (max-width: 1180px) { .sum { grid-template-columns: 1fr 1fr; } .sum .s1 { grid-column: 1 / -1; } }
  @media (max-width: 640px) { .sum { grid-template-columns: 1fr; } }
  .sum-c { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line); padding: 16px 20px 18px; min-width: 0; animation: rise .5s var(--ease) both; }
  .sum-c.s2 { animation-delay: .08s; } .sum-c.s3 { animation-delay: .16s; }
  button.sum-c { cursor: pointer; transition: border-color .2s, background .2s; } button.sum-c:hover { border-color: var(--line2); background: rgba(30, 48, 64, .8); }
  .sum-k { font: 600 12px/1 var(--head); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .sum-k b { color: var(--teal); margin-right: 8px; }
  .sum .res-head { margin: 0; }
  .sum-b { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .sum-b > div { min-width: 0; }
  .sum-b canvas { flex: none; width: 76px; height: 76px; border: 1px solid var(--line); }
  .sum-v { font: 700 clamp(22px, 2vw, 30px)/1.05 var(--head); text-transform: uppercase; letter-spacing: .02em; }
  .sum-s { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .sum-code { display: block; margin-top: 8px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .xh-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 0 0 16px; }
  .xh-fig { margin: 0; } .xh-fig canvas { display: block; width: 100%; height: 150px; border: 1px solid var(--line); }
  .xh-fig figcaption { font: 600 11px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
  .codebox { display: flex; gap: 10px; align-items: center; background: rgba(0, 0, 0, .28); border-left: 2px solid var(--teal); padding: 10px 12px; }
  .codebox code { flex: 1; min-width: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); overflow-wrap: anywhere; user-select: all; }
  table.kv td:first-child { color: var(--muted); width: 42%; }
  .sbars { display: grid; gap: 2px; }
  .sbar { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 4.2em; align-items: center; gap: 10px; padding: 7px 10px; font-size: 13px; }
  .sbar:nth-child(odd) { background: var(--row); }
  .sbar.on { outline: 1px solid rgba(42, 214, 176, .55); background: rgba(42, 214, 176, .08); }
  .sb-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-t { height: 6px; background: var(--line); position: relative; } .sb-t i { position: absolute; left: 0; top: 0; bottom: 0; opacity: .85; }
  .sb-v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .sb-why { margin: 0 0 6px; padding: 0 10px 6px; font-size: 12px; color: var(--dim); }
  @media (min-width: 1500px) { .duo .bd { grid-template-columns: 1fr; } }
  .res-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 20px; margin: 6px 0 30px; }
  @media (max-width: 640px) { .res-head { grid-template-columns: 1fr; } .meta { text-align: left; } }
  .big { margin: 0; font: 700 clamp(50px, 8.4vw, 88px)/.86 var(--head); letter-spacing: -.01em; display: flex; align-items: baseline; gap: .18em; flex-wrap: wrap; }
  .big .n1 { color: var(--teal); font-variant-numeric: tabular-nums; }
  .big .lab { color: var(--ink); text-transform: uppercase; }
  .big .n2 { color: var(--muted); font-size: .42em; font-variant-numeric: tabular-nums; }
  .meta { text-align: right; font: 600 12px/1.6 var(--head); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .meta b { color: var(--ink); font-weight: 600; }

  .layout { display: grid; grid-template-columns: clamp(170px, 12vw, 260px) minmax(0, 1fr) clamp(300px, 22vw, 440px); gap: clamp(20px, 2vw, 40px); align-items: start; }
  .duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 28px; }
  @media (min-width: 1500px) { .duo { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
  @media (max-width: 1080px) { .layout { grid-template-columns: 170px minmax(0, 1fr); } .side { grid-column: 2; } }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { grid-column: auto; } }
  .tabs { display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 760px) { .tabs { flex-direction: row; overflow-x: auto; scrollbar-width: none; } }
  .tab { position: relative; text-align: left; background: none; border: 0; cursor: pointer; padding: 14px 18px; white-space: nowrap;
    font: 600 16px/1 var(--head); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); transition: color .25s; }
  .tab::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(42, 214, 176, .55), rgba(42, 214, 176, .25));
    transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease); z-index: -1; }
  .tab::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: var(--teal); opacity: 0; transition: opacity .3s; }
  .tab { z-index: 0; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: #fff; }
  .tab[aria-selected="true"]::before { transform: scaleX(1); }
  .tab[aria-selected="true"]::after { opacity: 1; }
  @media (max-width: 760px) { .tab::after { left: 0; right: 0; top: auto; width: auto; height: 3px; } }

  .sec-t { font: 700 15px/1 var(--head); letter-spacing: .1em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 8px; border-bottom: 1px solid var(--line2); margin: 0 0 10px; gap: 12px; }
  .sec-t span { text-align: right; }
  .sec-t span { color: var(--dim); font-weight: 600; font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 26px 26px 22px; }
  @media (max-width: 560px) { .panel { padding: 18px 14px; } }
  .sub-t { background: var(--row); padding: 9px 10px; font: 600 14px/1 var(--head); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 4px; }
  .pane[hidden] { display: none; }
  .pane { animation: fade .35s var(--ease) both; }

  /* distribution */
  .dist { position: relative; margin: 6px 0 20px; }
  .dist svg { display: block; width: 100%; height: auto; overflow: visible; }
  .dist text { fill: var(--dim); font: 600 13px var(--head); letter-spacing: .08em; }
  .dist .lbl { fill: var(--ink); font-size: 15px; }
  .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.3s var(--ease) .15s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .band-in { opacity: 0; animation: fade .7s ease .7s forwards; }
  .pin { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: pin .55s var(--ease) 1.05s forwards; }
  @keyframes pin { to { transform: scaleY(1); } }
  .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .4s var(--ease) 1.45s forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }

  /* breakdown */
  .bd { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
  @media (max-width: 640px) { .bd { grid-template-columns: 1fr; } }
  .bd-h, .bd-r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 62px; align-items: center; gap: 8px; padding: 0 10px; }
  .bd-h { font: 600 13px var(--head); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); height: 40px; }
  .bd-r { height: 44px; font-size: 13px; }
  .bd-r:nth-of-type(even) { background: var(--row); }
  .bd-r .k { color: var(--muted); font: 600 12px var(--head); letter-spacing: .1em; text-transform: uppercase; }
  .bd-r .v { font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd-h span:nth-child(2) { text-align: center; } .bd-h span:last-child, .bd-r .im { text-align: right; }
  .im svg { width: 16px; height: 16px; vertical-align: middle; }
  .im .pct { font: 600 11px var(--head); color: var(--dim); margin-right: 4px; letter-spacing: .04em; }
  .row-in { opacity: 0; animation: rise .45s var(--ease) forwards; animation-delay: calc(1.1s + var(--i) * 60ms); }

  /* side */
  .side .panel { padding: 22px; }
  .side .panel + .sec-t { margin-top: 26px; }
  .badge-wrap { position: relative; display: grid; place-items: center; height: 170px; overflow: hidden;
    background: radial-gradient(60% 80% at 50% 50%, rgba(42, 214, 176, .12), transparent 70%), repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 2px, transparent 2px 9px); }
  .badge { position: relative; width: 104px; height: 104px; display: grid; place-items: center; background: #f4f1ea; color: #0f1923;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font: 700 30px/1 var(--head); letter-spacing: .02em;
    animation: badge .7s var(--ease) .35s both; overflow: hidden; }
  .badge::after { content: ""; position: absolute; inset: -40% auto -40% -60%; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
    transform: skewX(-20deg); animation: shine 1.1s ease 1.2s both; }
  @keyframes badge { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes shine { from { left: -60%; } to { left: 140%; } }
  .badge-cap { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  .gauge { position: relative; height: 34px; margin: 14px 4px 0; background: repeating-linear-gradient(90deg, var(--line2) 0 1px, transparent 1px 8px); background-size: 100% 12px; background-repeat: no-repeat; background-position: 0 100%; }
  .gauge i { position: absolute; bottom: 0; width: 2px; height: 26px; background: var(--ink); transform: scaleY(0); transform-origin: bottom; animation: pin .5s var(--ease) 1.3s forwards; }
  .gauge span { position: absolute; top: -2px; transform: translateX(-50%); font: 600 11px var(--head); color: var(--dim); letter-spacing: .08em; }

  .acc { display: grid; gap: 6px; }
  .acc-r { display: flex; align-items: center; gap: 14px; background: var(--row); padding: 12px 14px; opacity: 0; animation: rise .45s var(--ease) forwards; animation-delay: calc(1.4s + var(--i) * 80ms); }
  .acc-r .ic { flex: none; width: 34px; height: 34px; display: grid; place-items: center; background: rgba(42, 214, 176, .12); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); color: var(--teal); }
  .acc-r .ic svg { width: 16px; height: 16px; }
  .acc-r .t { font: 600 13px var(--head); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .acc-r .t b { color: var(--ink); font-size: 15px; margin-left: 4px; }
  .acc-r small { display: block; color: var(--dim); font: 400 12px var(--body); letter-spacing: 0; text-transform: none; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
  .actions .btn { padding: 9px 4px; letter-spacing: .1em; }
  .toast { font-size: 13px; color: var(--teal); align-self: center; min-height: 1em; }

  /* secondary tabs */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--dim); font: 600 11px var(--head); letter-spacing: .06em; }

function idxOf(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return i; return 0; }
function qNow() { return Q.filter(function (q) { return q.id === currentId; })[0]; }
function refreshNav() { var q = qNow(); var nx = document.getElementById("next"); if (nx && q) nx.disabled = !q.valid(); }

// Stagger every direct block and every choice so the question builds in.
function stagger(root) {
  var k = 0;
  Array.prototype.forEach.call(root.children, function (n) {
    if (n.classList.contains("q-body")) {

    } else { n.classList.add("anim"); n.style.setProperty("--i", k++); }

function countUp(node, to, decimals, ms, delay) {
  if (REDUCED) { node.textContent = to.toFixed(decimals); return; }
  var t0 = null; delay = delay || 0; node.textContent = (0).toFixed(decimals);
  function step(t) {
    if (t0 === null) t0 = t + delay;

    var p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);

}

// Distribution of the comparison pros' cm/360 (kernel density in log space) with your result.
function distChart(R, cur) {
  var W = 560, H = 210, L = 6, Rt = 6, T = 26, B = 28, xMin = 15, xMax = 110;
  var logs = M.PROS.map(function (p) { return Math.log(p.cm); });
  var sd = Math.sqrt(logs.reduce(function (s, x) { var m = M.PRO_STATS.logMean; return s + (x - m) * (x - m); }, 0) / (logs.length - 1));
  var bw = 1.06 * sd * Math.pow(logs.length, -0.2);
  function dens(c) { var lc = Math.log(c); return logs.reduce(function (s, x) { var z = (lc - x) / bw; return s + Math.exp(-0.5 * z * z); }, 0) / c; }
  var pts = [], yMax = 0;
  for (var c = xMin; c <= xMax; c += 0.5) { var d = dens(c); pts.push([c, d]); yMax = Math.max(yMax, d); }
  function x(v) { return L + (Math.min(xMax, Math.max(xMin, v)) - xMin) / (xMax - xMin) * (W - L - Rt); }
  function y(v) { return T + (1 - v / (yMax * 1.08)) * (H - T - B); }
  function seg(a, b) { return pts.filter(function (p) { return p[0] >= a - 0.25 && p[0] <= b + 0.25; }).map(function (p, i) { return (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1); }).join(""); }
  function len(a, b) { var q = pts.filter(function (p) { return p[0] >= a - 0.25 && p[0] <= b + 0.25; }), s = 0; for (var i = 1; i < q.length; i++) s += Math.hypot(x(q[i][0]) - x(q[i - 1][0]), y(q[i][1]) - y(q[i - 1][1])); return Math.ceil(s) + 2; }
  var lo = Math.max(xMin, R.lo), hi = Math.min(xMax, R.hi);
  var area = "M" + x(lo) + " " + (H - B) + seg(lo, hi).replace(/^M/, "L") + "L" + x(hi) + " " + (H - B) + "Z";
  var med = M.PRO_STATS.medianCm, you = R.cm;
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Distribution of ' + M.PRO_STATS.n + ' VCT pros by cm/360. Your result is ' + f1(you) + ' cm; near-optimal range ' + f1(R.lo) + " to " + f1(R.hi) + ' cm.">';
  s += '<defs><linearGradient id="bandG" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d24bd6" stop-opacity=".42"/><stop offset="1" stop-color="#d24bd6" stop-opacity=".08"/></linearGradient>' +
       '<linearGradient id="baseG" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2ad6b0" stop-opacity=".12"/><stop offset="1" stop-color="#2ad6b0" stop-opacity="0"/></linearGradient></defs>';
  s += '<rect x="' + L + '" y="' + T + '" width="' + (W - L - Rt) + '" height="' + (H - T - B) + '" fill="url(#baseG)" opacity=".5"/>';
  s += '<rect class="band-in" x="' + x(lo) + '" y="' + T + '" width="' + (x(hi) - x(lo)) + '" height="' + (H - T - B) + '" fill="rgba(210,75,214,.10)"/>';
  s += '<path class="band-in" d="' + area + '" fill="url(#bandG)"/>';
  s += '<line x1="' + x(med) + '" x2="' + x(med) + '" y1="' + y(dens(med)) + '" y2="' + (H - B) + '" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".6"/>';
  s += '<path class="draw" style="--len:' + len(xMin, lo) + '" d="' + seg(xMin, lo) + '" fill="none" stroke="#2a9fd6" stroke-width="2"/>';
  s += '<path class="draw" style="--len:' + len(lo, hi) + ';animation-delay:.45s" d="' + seg(lo, hi) + '" fill="none" stroke="var(--pink)" stroke-width="2.4"/>';
  s += '<path class="draw" style="--len:' + len(hi, xMax) + ';animation-delay:.8s" d="' + seg(hi, xMax) + '" fill="none" stroke="var(--yellow)" stroke-width="2"/>';
  s += '<line x1="' + L + '" x2="' + (W - Rt) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="var(--line2)"/>';
  // ticks: range edges, pro median, ends
  [[xMin, String(xMin)], [lo, f1(lo)], [med, "PRO " + Math.round(med)], [hi, f1(hi)], [xMax, xMax + " CM"]].forEach(function (t, k, arr) {
    var anchor = k === 0 ? "start" : k === arr.length - 1 ? "end" : "middle";
    s += '<text x="' + x(t[0]) + '" y="' + (H - B + 18) + '" text-anchor="' + anchor + '">' + t[1] + "</text>";
  });
  if (cur) s += '<g class="pop"><path d="M' + x(cur) + " " + (H - B - 6) + "l6 6-6 6-6-6z\" fill=\"var(--ink)\" transform=\"translate(0,-6)\"/></g>";
  var yy = y(dens(you));
  s += '<line class="pin" x1="' + x(you) + '" x2="' + x(you) + '" y1="' + yy + '" y2="' + (H - B) + '" stroke="#fff" stroke-width="2"/>';
  s += '<g class="pop"><circle cx="' + x(you) + '" cy="' + yy + '" r="6" fill="#fff"/><circle cx="' + x(you) + '" cy="' + yy + '" r="11" fill="none" stroke="#fff" stroke-opacity=".35"/>' +
       '<text class="lbl" x="' + x(you) + '" y="' + (yy - 16) + '" text-anchor="middle">' + f1(you) + "</text></g>";
  return s + "</svg>";
}

function costChart(R) {
  var W = 680, H = 240, L = 40, Rt = 12, T = 12, B = 30, xMin = 15, xMax = 120;
  var pts = R.curve, yMax = 0;
  pts.forEach(function (p) { if (p.C >= 20 && p.C <= 110) yMax = Math.max(yMax, p.total); });
  yMax = Math.min(yMax, R.modelCost.total * 2.2);
  function x(c) { return L + (c - xMin) / (xMax - xMin) * (W - L - Rt); }
  function y(v) { return T + (1 - Math.min(v, yMax * 1.5) / yMax) * (H - T - B); }
  function path(k) { return pts.map(function (p, i) { return (i ? "L" : "M") + x(p.C).toFixed(1) + " " + y(p[k]).toFixed(1); }).join(""); }

  countUp(document.getElementById("sensNum"), sens, 3, 1100, INTRO_MS);
